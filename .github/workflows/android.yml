name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract Android project
        run: |
          unzip -q expressive-launcher-test-ready.zip -d source
          GRADLEW="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "Could not find gradlew inside expressive-launcher-test-ready.zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Apply uploaded Kotlin source files
        run: |
          for file in *.kt; do
            [ -f "$file" ] || continue
            target="$(find source -type f -name "$file" -print -quit)"
            if [ -n "$target" ]; then
              cp "$file" "$target"
              echo "Applied $file to $target"
            fi
          done

      - name: Inspect extracted project structure
        run: |
          echo "=== Kotlin source files ==="
          find "$PROJECT_DIR" -type f -name '*.kt' | sort
          echo "=== App resources ==="
          find "$PROJECT_DIR/app/src/main" -maxdepth 4 -type f | sort | head -250

      - name: Inspect launcher implementation
        run: |
          for file in \
            "$PROJECT_DIR/app/src/main/java/com/example/expressivelauncher/ui/home/HomeScreen.kt" \
            "$PROJECT_DIR/app/src/main/java/com/example/expressivelauncher/ui/home/HomeState.kt" \
            "$PROJECT_DIR/app/src/main/java/com/example/expressivelauncher/data/CrashLog.kt" \
            "$PROJECT_DIR/app/src/main/java/com/example/expressivelauncher/LauncherViewModel.kt" \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml" \
            "$PROJECT_DIR/app/src/main/res/values/strings.xml"; do
            echo "===== $file ====="
            sed -n '1,260p' "$file"
          done

      - name: Build APK
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpressiveLauncher-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
