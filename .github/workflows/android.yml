name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract original Expressive Launcher
        run: |
          unzip -q expressive-launcher-test-ready.zip -d source
          GRADLEW="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "Could not find gradlew inside the original project ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"
          MAIN_ACTIVITY="$(find source -type f -name MainActivity.kt -print -quit)"
          sed -i 's/Intent\.CATEGORY_APP_ALARM/"android.intent.category.APP_ALARM"/' "$MAIN_ACTIVITY"

      - name: Apply narrow widget host lifecycle fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT_DIR"])
          candidates = list(project.rglob("WidgetHolder.kt"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected one WidgetHolder.kt, found {len(candidates)}")
          path = candidates[0]
          source = path.read_text()
          old = """    fun startListening() {
          if (listening) return
          listening = true
          runCatching { host.startListening() }
      }"""
          new = """    fun startListening() {
          if (listening) return
          // Only mark the host active after Android successfully starts its listener.
          // If startup fails transiently, the next Activity onStart() can retry.
          listening = runCatching { host.startListening() }.isSuccess
      }"""
          if old not in source:
              raise SystemExit("WidgetHolder.startListening() did not match expected original code; refusing to patch")
          path.write_text(source.replace(old, new, 1))
          print(f"Applied guarded widget host listener startup in {path}")
          PY

      - name: Build original project release APK
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpressiveLauncher-Release-APK
          path: source/**/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
