name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract original Expressive Launcher
        run: |
          unzip -q expressive-launcher-test-ready.zip -d source
          GRADLEW="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "Could not find gradlew inside the original project ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build original project
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpressiveLauncher-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
