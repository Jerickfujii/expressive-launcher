name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract original Expressive Launcher
        run: |
          unzip -q expressive-launcher-test-ready.zip -d source
          GRADLEW="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "Could not find gradlew inside the original project ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"
          MAIN_ACTIVITY="$(find source -type f -name MainActivity.kt -print -quit)"
          sed -i 's/Intent\.CATEGORY_APP_ALARM/"android.intent.category.APP_ALARM"/' "$MAIN_ACTIVITY"

      - name: Inspect widget implementation
        run: |
          echo "=== WIDGET RELATED FILES ==="
          find source -type f \\( -iname '*widget*.kt' -o -iname '*widget*.java' \\) -print
          echo "=== HOST AND VIEW IMPLEMENTATIONS ==="
          grep -R -n -E 'class WidgetHolder|fun createView|fun startListening|fun stopListening|AndroidView\(|updateAppWidgetSize|AppWidgetHostView' source --include='*.kt' | head -240
          echo "=== WIDGET HOLDER SOURCE ==="
          HOLDER="$(find source -type f -name WidgetHolder.kt -print -quit)"
          if [ -n "$HOLDER" ]; then sed -n '1,320p' "$HOLDER"; fi
          echo "=== WIDGET COMPOSABLE SOURCE ==="
          grep -R -l 'AppWidgetHostView\|createView(ctx' source --include='*.kt' | while read f; do echo "--- $f"; grep -n -B 18 -A 45 'createView(ctx\|AppWidgetHostView\|AndroidView(' "$f" | head -220; done


      - name: Inspect animation and device compatibility paths
        run: |
          echo "=== ANIMATION AND FRAME TIMING ==="
          grep -R -n -E 'animate[A-Z]|AnimatedVisibility|AnimatedContent|spring\\(|tween\\(|withFrameNanos|Choreographer|graphicsLayer|RenderEffect|Blur' source --include='*.kt' | head -320 || true
          echo "=== DEVICE-SPECIFIC OPTIMIZATIONS ==="
          grep -R -n -E 'isZteBladeA75|Z2357N|Build\\.MANUFACTURER|Build\\.MODEL|PowerManager|isPowerSaveMode|areAnimatorsEnabled' source --include='*.kt' | head -220 || true
          echo "=== CRASH AND LIFECYCLE HANDLING ==="
          grep -R -n -E 'CrashLog|uncaughtException|Thread\\.setDefaultUncaughtExceptionHandler|onStart\\(|onStop\\(|onDestroy\\(|DisposableEffect|onRelease' source --include='*.kt' | head -260 || true
          echo "=== BUILD CONFIGURATION ==="
          find source -type f \\( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradle.properties' \\) -print
          grep -R -n -E 'minSdk|targetSdk|compileSdk|jvmTarget|composeCompiler|kotlinOptions|freeCompilerArgs' source --include='*.gradle' --include='*.gradle.kts' --include='gradle.properties' | head -180 || true

      - name: Build original project release APK
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpressiveLauncher-Release-APK
          path: source/**/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
